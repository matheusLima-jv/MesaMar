# Produção na VPS: aplicação + PostgreSQL.
#
# Uso (ver docs/deploy.md):
#   cd /opt/mesamar
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# A aplicação NÃO publica porta no host: o Nginx (que já roda em Docker na VPS)
# fala com ela pela rede Docker externa "web". Nada muda no firewall.
name: mesamar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mesamar}
      POSTGRES_USER: ${DB_USER:-mesamar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # Tag da imagem publicada pelo CI. Para voltar a uma versão anterior, troque
    # MESAMAR_TAG no .env pelo SHA do commit (ex.: 34d4f4d) e rode "up -d" de novo.
    image: ghcr.io/matheuslima-jv/mesamar:${MESAMAR_TAG:-latest}
    container_name: mesamar-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-mesamar}
      DB_USER: ${DB_USER:-mesamar}
      DB_PASSWORD: ${DB_PASSWORD}
      MESAMAR_PUBLIC_URL: ${MESAMAR_PUBLIC_URL:?defina MESAMAR_PUBLIC_URL no .env}
      MESAMAR_WHATSAPP: ${MESAMAR_WHATSAPP:-}
      MESAMAR_CONTACT_EMAIL: ${MESAMAR_CONTACT_EMAIL:-}
      MESAMAR_CF_ANALYTICS_TOKEN: ${MESAMAR_CF_ANALYTICS_TOKEN:-}
      MESAMAR_TURNSTILE_SITE_KEY: ${MESAMAR_TURNSTILE_SITE_KEY:-}
      MESAMAR_TURNSTILE_SECRET_KEY: ${MESAMAR_TURNSTILE_SECRET_KEY:-}
      MESAMAR_VAPID_PUBLIC_KEY: ${MESAMAR_VAPID_PUBLIC_KEY:-}
      MESAMAR_VAPID_PRIVATE_KEY: ${MESAMAR_VAPID_PRIVATE_KEY:-}
      MESAMAR_VAPID_SUBJECT: ${MESAMAR_VAPID_SUBJECT:-}
      MESAMAR_ADMIN_USER: ${MESAMAR_ADMIN_USER:-admin}
      MESAMAR_ADMIN_PASSWORD: ${MESAMAR_ADMIN_PASSWORD:?defina MESAMAR_ADMIN_PASSWORD no .env}
      MESAMAR_MAIL_FROM: ${MESAMAR_MAIL_FROM:-MesaMar <nao-responda@localhost>}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      JAVA_OPTS: -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError
    networks: [internal, web]
    mem_limit: 768m

volumes:
  db-data:

networks:
  internal:
  # Rede compartilhada com o container do Nginx (criada uma vez: docker network create web)
  web:
    external: true
    name: ${NGINX_NETWORK:-web}
