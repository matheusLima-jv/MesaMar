# Incluído pelos "location" do mesamar.conf (copie para /etc/nginx/snippets/mesamar-proxy.conf)
proxy_http_version 1.1;
proxy_set_header Host $host;
# SOBRESCREVE (não acrescenta) o X-Forwarded-For com o IP real já resolvido acima.
# Assim ninguém consegue inventar um IP mandando esse cabeçalho.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
# O Spring também lê o cabeçalho padrão "Forwarded" (RFC 7239) e os X-Forwarded-Port/Prefix/Ssl, e o "Forwarded" tem
# prioridade sobre o X-Forwarded-For. Vazio = o Nginx não repassa: ninguém falsifica o IP (nem a porta ou o caminho) por eles.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header Connection "";
proxy_read_timeout 60s;
