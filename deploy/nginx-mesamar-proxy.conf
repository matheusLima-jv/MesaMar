# Incluído pelos "location" do mesamar.conf (copie para /etc/nginx/snippets/mesamar-proxy.conf)
proxy_http_version 1.1;
proxy_set_header Host $host;
# SOBRESCREVE (não acrescenta) o X-Forwarded-For com o IP real já resolvido acima.
# Assim ninguém consegue inventar um IP mandando esse cabeçalho.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_read_timeout 60s;
