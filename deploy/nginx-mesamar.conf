# Nginx — MesaMar
# Copie para a pasta de configs do seu container Nginx (ex.: conf.d/mesamar.conf)
# e troque os caminhos dos certificados pelos que você já usa com o Certbot.
# Nginx anterior à 1.25.1: troque "http2 on;" por "listen 443 ssl http2;".

server {
    listen 80;
    listen [::]:80;
    server_name mesamar.r4d4r.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mesamar.r4d4r.online;

    # Certificado emitido pelo Certbot (Cloudflare em modo Full (Strict))
    ssl_certificate     /etc/letsencrypt/live/mesamar.r4d4r.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mesamar.r4d4r.online/privkey.pem;

    client_max_body_size 1m;

    # --- IP real do visitante vindo da Cloudflare (só neste site) ----------------------
    # Sem isto, a aplicação veria o IP da Cloudflare e o limite de envios por aparelho
    # valeria para todo mundo junto (ou poderia ser burlado com um cabeçalho falso).
    # Lista oficial: https://www.cloudflare.com/ips/ (confira se mudou antes de aplicar)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # O painel e as APIs internas nunca devem ficar em cache na Cloudflare
    location ~ ^/(admin|api)/ {
        proxy_pass http://mesamar-app:8080;
        include /etc/nginx/snippets/mesamar-proxy.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://mesamar-app:8080;
        include /etc/nginx/snippets/mesamar-proxy.conf;
    }
}
