# Configuração comum a todos os perfis.
# Perfis: local (desenvolvimento), test (testes automatizados), prod (servidor).
spring:
  application:
    name: mesamar
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mesamar}
    username: ${DB_USER:mesamar}
    password: ${DB_PASSWORD:mesamar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é responsabilidade do Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework # atrás do Nginx/Cloudflare
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
