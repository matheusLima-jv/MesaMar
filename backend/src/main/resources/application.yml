# Configuração comum a todos os perfis.
# Perfis: local (desenvolvimento), test (testes automatizados), prod (servidor).
spring:
  application:
    name: mesamar
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mesamar}
    username: ${DB_USER:mesamar}
    password: ${DB_PASSWORD:mesamar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é responsabilidade do Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      # Ativa a cadeia de recursos: o Thymeleaf passa a gerar URLs com hash
      # (ex.: /css/landing-<hash>.css). O cache longo é configurado em StaticCacheConfig.
      chain:
        enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework # atrás do Nginx/Cloudflare
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml,text/plain,application/xml

# Configurações públicas do site (ver SiteProperties e .env.example)
mesamar:
  site:
    public-base-url: ${MESAMAR_PUBLIC_URL:http://localhost:8080}
    whatsapp-number: ${MESAMAR_WHATSAPP:}
    contact-email: ${MESAMAR_CONTACT_EMAIL:}
    cloudflare-analytics-token: ${MESAMAR_CF_ANALYTICS_TOKEN:}
  # Painel /admin. Sem senha, o painel fica trancado (ninguém entra).
  admin:
    username: ${MESAMAR_ADMIN_USER:admin}
    password: ${MESAMAR_ADMIN_PASSWORD:}
  # Cloudflare Turnstile (anti-robô do formulário). Sem as duas chaves, fica desligado.
  turnstile:
    site-key: ${MESAMAR_TURNSTILE_SITE_KEY:}
    secret-key: ${MESAMAR_TURNSTILE_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
