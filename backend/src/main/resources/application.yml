# Configuração comum a todos os perfis.
# Perfis: local (desenvolvimento), test (testes automatizados), prod (servidor).
spring:
  application:
    name: mesamar
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mesamar}
    username: ${DB_USER:mesamar}
    password: ${DB_PASSWORD:mesamar}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      data-source-properties:
        options: "-c statement_timeout=15000 -c lock_timeout=3000"
  task:
    scheduling:
      pool:
        size: 4
  transaction:
    default-timeout: 30s
  lifecycle:
    timeout-per-shutdown-phase: 15s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é responsabilidade do Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
  # E-mail (troca de senha). O SMTP só liga quando SPRING_MAIL_HOST está definido;
  # sem ele, o e-mail vai para o log (ver SmtpOrLogEmailGateway).
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  web:
    resources:
      # Ativa a cadeia de recursos: o Thymeleaf passa a gerar URLs com hash
      # (ex.: /css/landing-<hash>.css). O cache longo é configurado em StaticCacheConfig.
      chain:
        enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework # atrás do Nginx/Cloudflare
  servlet:
    session:
      # O dono passa o dia na praia com o painel aberto: não queremos pedir login toda hora.
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml,text/plain,application/xml

# Configurações públicas do site (ver SiteProperties e .env.example)
mesamar:
  site:
    public-base-url: ${MESAMAR_PUBLIC_URL:http://localhost:8080}
    whatsapp-number: ${MESAMAR_WHATSAPP:}
    contact-email: ${MESAMAR_CONTACT_EMAIL:}
    cloudflare-analytics-token: ${MESAMAR_CF_ANALYTICS_TOKEN:}
  # Painel /admin. Sem senha, o painel fica trancado (ninguém entra).
  admin:
    username: ${MESAMAR_ADMIN_USER:admin}
    password: ${MESAMAR_ADMIN_PASSWORD:}
  # Remetente dos e-mails do painel
  mail:
    from: ${MESAMAR_MAIL_FROM:MesaMar <nao-responda@localhost>}
    # Só para desenvolvimento: sem SMTP, o e-mail (com o link de troca de senha) vai inteiro para o log. Em produção, desligado.
    logar-corpo-sem-smtp: ${MESAMAR_MAIL_LOGAR_CORPO:false}
  # Web Push (avisos de pedido com o app fechado). Sem as duas chaves VAPID, o push fica desligado e o app avisa o dono.
  # Gere o par com: ./gradlew --console=plain -q :backend:gerarVapid  (a privada é segredo: só no .env)
  push:
    public-key: ${MESAMAR_VAPID_PUBLIC_KEY:}
    private-key: ${MESAMAR_VAPID_PRIVATE_KEY:}
    subject: ${MESAMAR_VAPID_SUBJECT:}
  # Cloudflare Turnstile (anti-robô do formulário). Sem as duas chaves, fica desligado.
  turnstile:
    site-key: ${MESAMAR_TURNSTILE_SITE_KEY:}
    secret-key: ${MESAMAR_TURNSTILE_SECRET_KEY:}

management:
  health:
    # SMTP fora do ar não pode tirar a aplicação do ar (o healthcheck derrubaria o container).
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  versao:
    commit: ${MESAMAR_REVISION:desenvolvimento}
management.info.env.enabled: true
