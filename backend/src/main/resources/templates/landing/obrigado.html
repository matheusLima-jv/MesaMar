<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Você está na lista — MesaMar</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="icon" href="../../static/img/favicon.svg" th:href="@{/img/favicon.svg}" type="image/svg+xml">
  <link rel="preload" href="../../static/fonts/bricolage-grotesque-latin-wght.woff2" th:href="@{/fonts/bricolage-grotesque-latin-wght.woff2}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../static/css/landing.css" th:href="@{/css/landing.css}">
  <script th:replace="~{landing/index :: analytics}"></script>
</head>
<body>
<header th:replace="~{landing/index :: siteHeader}"></header>

<main id="conteudo" class="message-page">
  <div class="wrap">
    <p class="kicker">Lista de espera</p>
    <h1>Pronto, você está na lista.</h1>
    <p class="lead">Recebemos o seu contato. Nos próximos dias a gente chama você no WhatsApp para combinar uma visita rápida na sua barraca e mostrar como o piloto funciona.</p>
    <div class="cta-row">
      <a class="btn btn-ink" href="/" th:href="@{/}">Voltar para o início</a>
      <a class="btn btn-line" href="https://wa.me/" th:if="${site.hasWhatsapp}" th:href="${whatsappLink}" target="_blank" rel="noopener">Adiantar pelo WhatsApp</a>
    </div>
  </div>
</main>

<footer th:replace="~{landing/index :: siteFooter}"></footer>
</body>
</html>
