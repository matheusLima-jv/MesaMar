<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muitas tentativas — MesaMar</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="icon" href="../../static/img/favicon.svg" th:href="@{/img/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" href="../../static/css/landing.css" th:href="@{/css/landing.css}">
</head>
<body>
<header th:replace="~{landing/index :: siteHeader}"></header>

<main id="conteudo" class="message-page">
  <div class="wrap">
    <p class="kicker">Calma aí</p>
    <h1>Recebemos muitos envios desta conexão.</h1>
    <p class="lead">Para evitar spam, limitamos os envios por alguns minutos. Espere uns 10 minutos e tente de novo, ou fale direto com a gente pelo WhatsApp.</p>
    <div class="cta-row">
      <a class="btn btn-ink" href="/#lista-de-espera" th:href="@{/} + '#lista-de-espera'">Voltar ao formulário</a>
      <a class="btn btn-line" href="https://wa.me/" th:if="${site.hasWhatsapp}" th:href="${whatsappLink}" target="_blank" rel="noopener">Falar no WhatsApp</a>
    </div>
  </div>
</main>

<footer th:replace="~{landing/index :: siteFooter}"></footer>
</body>
</html>
