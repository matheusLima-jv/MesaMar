# Ambiente local completo: aplicação + PostgreSQL.
#   docker compose up --build
#   http://localhost:8080/actuator/health
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mesamar}
      POSTGRES_USER: ${DB_USER:-mesamar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mesamar}
    ports:
      # Só na sua máquina (não expõe o banco na rede Wi-Fi). Se já houver um Postgres
      # usando a 5432, troque para "127.0.0.1:5433:5432".
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Perfil local por padrão (logs legíveis, detalhes no health). Para simular produção,
      # coloque SPRING_PROFILES_ACTIVE=prod no .env.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-mesamar}
      DB_USER: ${DB_USER:-mesamar}
      DB_PASSWORD: ${DB_PASSWORD:-mesamar}
      MESAMAR_PUBLIC_URL: ${MESAMAR_PUBLIC_URL:-http://localhost:8080}
      MESAMAR_WHATSAPP: ${MESAMAR_WHATSAPP:-}
      MESAMAR_CONTACT_EMAIL: ${MESAMAR_CONTACT_EMAIL:-}
      MESAMAR_CF_ANALYTICS_TOKEN: ${MESAMAR_CF_ANALYTICS_TOKEN:-}
      MESAMAR_TURNSTILE_SITE_KEY: ${MESAMAR_TURNSTILE_SITE_KEY:-}
      MESAMAR_TURNSTILE_SECRET_KEY: ${MESAMAR_TURNSTILE_SECRET_KEY:-}
      MESAMAR_VAPID_PUBLIC_KEY: ${MESAMAR_VAPID_PUBLIC_KEY:-}
      MESAMAR_VAPID_PRIVATE_KEY: ${MESAMAR_VAPID_PRIVATE_KEY:-}
      MESAMAR_VAPID_SUBJECT: ${MESAMAR_VAPID_SUBJECT:-}
      MESAMAR_ADMIN_USER: ${MESAMAR_ADMIN_USER:-admin}
      MESAMAR_ADMIN_PASSWORD: ${MESAMAR_ADMIN_PASSWORD:-}
      MESAMAR_MAIL_FROM: ${MESAMAR_MAIL_FROM:-MesaMar <nao-responda@localhost>}
      # Só no compose de desenvolvimento: o link de troca de senha aparece no log (docker compose logs app)
      MESAMAR_MAIL_LOGAR_CORPO: "true"
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    ports:
      # Aberto na rede local de propósito: permite testar pelo celular no mesmo Wi-Fi
      - "8080:8080"

volumes:
  db-data:
