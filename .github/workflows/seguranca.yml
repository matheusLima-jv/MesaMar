name: Dependências e segredos
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Auditar dependências JS
        run: |
          for app in web-customer web-staff e2e; do (cd "$app" && npm ci --ignore-scripts && npm audit --audit-level=high); done
      - name: Inventário das dependências Kotlin de execução
        run: ./gradlew :backend:inventarioDependencias -PskipFrontendBuild
      - name: Auditar bibliotecas realmente entregues
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.70.0
          scan-type: sbom
          scan-ref: backend/build/runtime.cdx.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Auditar a imagem e seus pacotes do sistema regularmente
        run: docker build --tag mesamar-auditoria:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.70.0
          image-ref: mesamar-auditoria:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Detectar segredos no histórico e nas fontes
        run: |
          scanner=ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker run --rm -v "$PWD:/repo:ro" "$scanner" git /repo --config /repo/.gitleaks.toml --redact --log-opts=--all
          git ls-files -z | tar --null -T - -cf /tmp/fontes.tar
          mkdir /tmp/fontes-mesamar
          tar -xf /tmp/fontes.tar -C /tmp/fontes-mesamar
          docker run --rm -v /tmp/fontes-mesamar:/repo:ro "$scanner" dir /repo --config /repo/.gitleaks.toml --redact
