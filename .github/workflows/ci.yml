name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web-staff/package-lock.json
            web-customer/package-lock.json

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Integridade do Wrapper
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256

      - name: ktlint
        run: |
          set -o pipefail
          ./gradlew --no-daemon ktlintCheck 2>&1 | tee -a build.log

      # `build` roda npm ci + build dos fronts, compila o Kotlin e executa todos os
      # testes (incluindo os de integração com PostgreSQL via Testcontainers).
      - name: Build e testes
        run: |
          set -o pipefail
          ./gradlew --no-daemon build 2>&1 | tee -a build.log

      - name: Testar sinais de alerta independentes
        run: python3 .github/scripts/testar-alertas.py

      - name: Resumo dos testes
        if: always()
        run: bash .github/scripts/test-summary.sh

      - name: Anotar falhas
        if: failure()
        run: bash .github/scripts/annotate-failures.sh build.log

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  docker:
    name: Imagem Docker + E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Senha descartável, só para o painel do ambiente de teste do CI
      MESAMAR_ADMIN_PASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construir uma vez a imagem que será testada e publicada
        run: |
          docker build --build-arg MESAMAR_REVISION=${{ github.sha }} --tag mesamar-validada:${{ github.sha }} .
          printf 'services:\n  app:\n    image: mesamar-validada:${{ github.sha }}\n' > compose.ci.yml

      # Sobe o mesmo ambiente que o desenvolvedor usa localmente e confere o health.
      - name: Smoke test com docker compose
        run: |
          docker compose -f docker-compose.yml -f compose.ci.yml up -d --no-build --wait --wait-timeout 180
          curl -fsS http://localhost:8080/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'
          curl -fsS http://localhost:8080/staff/ | grep -q 'data-app="web-staff"'
          curl -fsS http://localhost:8080/cliente/ | grep -q 'data-app="web-customer"'
          curl -fsS http://localhost:8080/ | grep -q 'Seu cliente pede pelo celular'
          curl -fsS http://localhost:8080/privacidade | grep -q 'Lei Geral de Proteção de Dados'
          echo "::notice title=Smoke test::docker compose up OK — health UP · landing · privacidade · /staff/ · /cliente/"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      # Testes de ponta a ponta no tamanho de celular contra o mesmo docker compose
      - name: E2E (Playwright)
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_PASSWORD: ${{ env.MESAMAR_ADMIN_PASSWORD }}
        run: npx playwright test

      # Prova que o backup restaura: dump do banco que acabou de passar pelo E2E, restauração num banco descartável e
      # comparação de todas as tabelas (docs/deploy.md, "Teste de restauração")
      - name: Teste de restauração do backup
        run: |
          # Sem pipefail, o "tee" (que sempre dá certo) esconderia a falha do script
          set -o pipefail
          MESAMAR_BACKUP_DIR=/tmp/mesamar-backups MESAMAR_COMPOSE="docker compose -f docker-compose.yml -f compose.ci.yml" bash deploy/backup/testar-restauracao.sh | tee /tmp/restauracao.log
          echo "::notice title=Backup::$(tail -n 1 /tmp/restauracao.log | cut -d' ' -f3-)"

      - name: Ensaio de corrupção e falha de recuperação
        run: |
          docker compose exec -T db apk add --no-cache python3 restic
          docker compose exec -T db mkdir -p /workspace/deploy
          docker compose cp deploy/. db:/workspace/deploy
          docker compose cp .github/scripts/testar-backup-no-banco.sh db:/workspace/testar-backup.sh
          docker compose exec -T -e MESAMAR_OPERACAO_TESTE=1 db bash /workspace/testar-backup.sh
          docker compose cp .github/scripts/testar-restic.sh db:/workspace/testar-restic.sh
          docker compose exec -T db bash /workspace/testar-restic.sh

      - name: Verificar vulnerabilidades da imagem validada
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.70.0
          image-ref: mesamar-validada:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Resumo do E2E
        if: always()
        run: node .github/scripts/e2e-summary.mjs e2e/test-results/results.json

      - name: Relatório do E2E
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Logs do compose (se falhar)
        if: failure()
        run: |
          # Sem as linhas "at ..." das stack traces: sobra o que importa (erro e causa).
          docker compose logs --no-color --tail 400 \
            | grep -v $'^app-1  | \tat \\|^app-1  | \t\\.\\.\\.' \
            | tail -n 80 \
            | python3 -c "import sys; print('::error title=Logs do compose::' + sys.stdin.read()[-6000:].replace('%','%25').replace('\n','%0A'))"

      - name: Derrubar compose
        if: always()
        run: docker compose down -v

      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem aprovada sem reconstruir
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          destino="ghcr.io/${GITHUB_REPOSITORY,,}"
          imagem="${destino}:${GITHUB_SHA}"
          id_validado=$(docker image inspect "mesamar-validada:${GITHUB_SHA}" --format '{{.Id}}')
          docker tag "mesamar-validada:${GITHUB_SHA}" "$imagem"
          test "$(docker image inspect "$imagem" --format '{{.Id}}')" = "$id_validado"
          docker push "$imagem"
          digest=$(docker image inspect "$imagem" --format '{{index .RepoDigests 0}}')
          printf '{"commit":"%s","imagem":"%s","idTestado":"%s"}\n' "$GITHUB_SHA" "$digest" "$id_validado" > versao-validada.json

      - name: Registrar versão validada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: versao-validada
          path: |
            versao-validada.json
            deploy/compatibilidade.json
          retention-days: 90
