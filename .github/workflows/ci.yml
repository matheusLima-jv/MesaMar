name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web-staff/package-lock.json
            web-customer/package-lock.json

      - uses: gradle/actions/setup-gradle@v5

      - name: ktlint
        run: |
          set -o pipefail
          ./gradlew --no-daemon ktlintCheck 2>&1 | tee -a build.log

      # `build` roda npm ci + build dos fronts, compila o Kotlin e executa todos os
      # testes (incluindo os de integração com PostgreSQL via Testcontainers).
      - name: Build e testes
        run: |
          set -o pipefail
          ./gradlew --no-daemon build 2>&1 | tee -a build.log

      - name: Anotar falhas
        if: failure()
        run: bash .github/scripts/annotate-failures.sh build.log

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  docker:
    name: Imagem Docker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Em PR a imagem só é construída (garante que o Dockerfile funciona).
      # Em main ela também é publicada no GHCR. O deploy continua manual.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
