name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web-staff/package-lock.json
            web-customer/package-lock.json

      - uses: gradle/actions/setup-gradle@v5

      - name: ktlint
        run: |
          set -o pipefail
          ./gradlew --no-daemon ktlintCheck 2>&1 | tee -a build.log

      # `build` roda npm ci + build dos fronts, compila o Kotlin e executa todos os
      # testes (incluindo os de integração com PostgreSQL via Testcontainers).
      - name: Build e testes
        run: |
          set -o pipefail
          ./gradlew --no-daemon build 2>&1 | tee -a build.log

      - name: Resumo dos testes
        if: always()
        run: bash .github/scripts/test-summary.sh

      - name: Anotar falhas
        if: failure()
        run: bash .github/scripts/annotate-failures.sh build.log

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  docker:
    name: Imagem Docker + E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Senha descartável, só para o painel do ambiente de teste do CI
      MESAMAR_ADMIN_PASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Sobe o mesmo ambiente que o desenvolvedor usa localmente e confere o health.
      - name: Smoke test com docker compose
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://localhost:8080/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'
          curl -fsS http://localhost:8080/staff/ | grep -q 'data-app="web-staff"'
          curl -fsS http://localhost:8080/cliente/ | grep -q 'data-app="web-customer"'
          curl -fsS http://localhost:8080/ | grep -q 'Seu cliente pede pelo celular'
          curl -fsS http://localhost:8080/privacidade | grep -q 'Lei Geral de Proteção de Dados'
          echo "::notice title=Smoke test::docker compose up OK — health UP · landing · privacidade · /staff/ · /cliente/"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Testes de ponta a ponta no tamanho de celular contra o mesmo docker compose
      - name: E2E (Playwright)
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_PASSWORD: ${{ env.MESAMAR_ADMIN_PASSWORD }}
        run: npx playwright test

      # Prova que o backup restaura: dump do banco que acabou de passar pelo E2E, restauração num banco descartável e
      # comparação de todas as tabelas (docs/deploy.md, "Teste de restauração")
      - name: Teste de restauração do backup
        run: |
          bash deploy/backup/testar-restauracao.sh | tee /tmp/restauracao.log
          echo "::notice title=Backup::$(tail -n 1 /tmp/restauracao.log | cut -d' ' -f3-)"

      - name: Resumo do E2E
        if: always()
        run: node .github/scripts/e2e-summary.mjs e2e/test-results/results.json

      - name: Relatório do E2E
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Logs do compose (se falhar)
        if: failure()
        run: |
          # Sem as linhas "at ..." das stack traces: sobra o que importa (erro e causa).
          docker compose logs --no-color --tail 400 \
            | grep -v $'^app-1  | \tat \\|^app-1  | \t\\.\\.\\.' \
            | tail -n 80 \
            | python3 -c "import sys; print('::error title=Logs do compose::' + sys.stdin.read()[-6000:].replace('%','%25').replace('\n','%0A'))"

      - name: Derrubar compose
        if: always()
        run: docker compose down -v

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Em PR a imagem só é construída (garante que o Dockerfile funciona).
      # Em main ela também é publicada no GHCR. O deploy continua manual.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
